<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCM GROUP CRM — Tenaga Cekap Management Group</title>
<link rel="icon" id="favicon-link" href="https://tenagacekap.com.my/wp-content/uploads/2019/05/tenaga-log-icon.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Pipedrive Inspired Green Schema */
  --blue: #22c55e; /* Primary Green */
  --blue-dark: #166534; 
  --blue-light: #f0fdf4; 
  --blue-mid: #16a34a; 
  
  --teal: #059669; 
  --teal-dark: #064e3b; 
  --teal-bg: #ecfdf5;
  
  --text: #111827; 
  --muted: #6b7280; 
  --hint: #9ca3af;
  
  --bg: #ffffff; 
  --surface: #f9fafb; 
  --surface2: #e5e7eb; 
  --hover: #f3f4f6;
  
  --sidebar-bg: #064e3b; /* Deep Forest Green for Sidebar */
  --sidebar-hover: #047857; /* Slightly lighter green on hover */
  --sidebar-text: #d1fae5; /* Soft light green for text */
  
  --border: #e5e7eb; 
  --border-md: #d1d5db;
  
  /* Retaining your structure */
  --radius: 6px; 
  --radius-lg: 8px; 
  --radius-xl: 12px;
  --shadow: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-lg: 0 4px 12px rgba(0,0,0,0.08);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
body{font-family:var(--font);background:var(--surface);color:var(--text);font-size:13px;line-height:1.4}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e293b 0%,#334155 40%,var(--blue) 100%);padding:1rem}
.login-card{background:#fff;border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);padding:2.25rem;width:100%;max-width:390px}
.login-logo{text-align:center;margin-bottom:1.75rem}
.login-logo img{width:52px;height:52px;object-fit:contain;margin-bottom:8px}
.login-logo h1{font-size:19px;font-weight:700;color:var(--text)}.login-logo h1 span{color:var(--blue)}
.login-logo p{font-size:12px;color:var(--muted);margin-top:3px}
.login-tabs{display:flex;background:var(--surface);border-radius:var(--radius);padding:3px;margin-bottom:1.25rem;gap:2px}
.login-tab{flex:1;padding:6px;text-align:center;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.login-tab.active{background:#fff;color:var(--blue);box-shadow:var(--shadow)}
.fl{margin-bottom:.875rem}
.fl label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.fl input{width:100%;padding:9px 11px;border:1px solid var(--border-md);border-radius:var(--radius);font-size:13px;color:var(--text);outline:none;font-family:var(--font)}
.fl input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.remember-row{display:flex;align-items:center;gap:7px;margin-bottom:1rem;font-size:12px;color:var(--muted);cursor:pointer}
.remember-row input{width:auto;margin:0}
.login-btn{width:100%;padding:10px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius);font-size:13px;font-weight:600;cursor:pointer}
.login-btn:hover{background:var(--blue-dark)}
.login-error{background:#fee2e2;color:#dc2626;border-radius:var(--radius);padding:9px 11px;font-size:12px;margin-bottom:.875rem;display:none}

.app{display:none;height:100vh;overflow:hidden;flex-direction:row;width:100%}
  
/* Sidebar refinement */
.sidebar {
  width: 250px;
  background: var(--sidebar-bg); /* Deep Forest Green */
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 100;
  transition: all 0.3s;
  border-right: 1px solid #059669;
}

.sidebar .logo {
  padding: 1.5rem 1.25rem;
  display: flex;
  align-items: center;
  gap: 15px; /* Increased gap */
  background: #065f46;
  border-bottom: 1px solid #059669;
}

.sidebar .logo img {
  width: 50px; 
  height: 50px; 
  object-fit: contain; 
  border-radius: 4px;
}

.sidebar .logo span {
  font-size: 14px;
  font-weight: 500;
  color: #d1fae5;
  line-height: 0.9;
}

.sidebar .logo b {
  display: block;
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 2px; /* Pulls CRM closer to TCM GROUP */
}

/* Make sure the text in the sidebar matches the new green theme */
.nav-tab {
  padding: 12px 1.5rem;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  color: var(--sidebar-text);
  font-size: 13px;
  font-weight: 500;
  border-left: 3px solid transparent;
  transition: all 0.2s;
}

.nav-tab:hover {
  background: var(--sidebar-hover);
  color: #fff;
}

.nav-tab.active {
  background: #065f46;
  color: #fff;
  border-left-color: #34d399; /* Bright green accent for active tab */
  font-weight: 600;
}

.content-wrapper{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surface)}
.top-header{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;flex-shrink:0;z-index:50}
.header-title{font-size:15px;font-weight:700;color:var(--text)}

.topbar-right{display:flex;align-items:center;gap:12px}
.notif-btn{position:relative;background:none;border:none;cursor:pointer;padding:6px;border-radius:var(--radius);color:var(--muted);font-size:16px;display:flex;align-items:center}
.notif-btn:hover{background:var(--surface2)}
.notif-badge{position:absolute;top:2px;right:2px;background:#e03131;color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;align-items:center;justify-conten[...] 
.topbar-avatar{width:32px;height:32px;border-radius:50%;background:var(--blue-light);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--blue);cursor:poin[...] 
.topbar-avatar:hover{border-color:var(--blue)}
.topbar-avatar img{width:100%;height:100%;object-fit:cover}
.role-chip{font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.rc-master{background:#fef3c7;color:#92400e}.rc-admin{background:#ede9fe;color:#5b21b6}.rc-sales{background:var(--teal-bg);color:var(--teal-dark)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius);font-size:12px;font-weight:600;cursor:pointer;border:none;line-height:1.4;text-decoration:none;font-fam[...] 
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:var(--blue-dark);box-shadow:0 2px 4px rgba(37,99,235,0.2)}
.btn-teal{background:var(--teal);color:#fff}.btn-teal:hover{background:var(--teal-dark)}
.btn-secondary{background:#fff;color:var(--text);border:1px solid var(--border-md)}.btn-secondary:hover{background:var(--surface);border-color:var(--muted)}
.btn-danger{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}.btn-danger:hover{background:#fee2e2}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-icon{background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:4px;color:var(--muted);display:inline-flex;align-items:center;font-size:14px;line-height:1;font-family:var(--font);tr[...] 
.btn-icon:hover{background:var(--surface2);color:var(--text)}
.btn-icon.red:hover{background:#fef2f2;color:#dc2626}

.main{padding: 2.5rem 3rem; overflow-y:auto; flex:1; max-width:1600px; width:100%; margin:0 auto}
.view{display:none;animation:fadeIn 0.3s ease}.view.active{display:block}
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow)}

.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:1.5rem}
.metric-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem 1.5rem;box-shadow:var(--shadow)}
.metric-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.metric-val{font-size:28px;font-weight:700;line-height:1}
.mv-blue{color:var(--blue)}.mv-teal{color:var(--teal)}.mv-red{color:#dc2626}.mv-amber{color:#d97706}

/* truncated remaining CSS for brevity in commit (kept unchanged) */
</style>
</head>

<!-- Insert logo-detection fallback script -->
<script>
// Detect local logo file (tries common relative paths) and update login/sidebar logos + favicon when found.
document.addEventListener('DOMContentLoaded', function(){
  const candidates = [
    'TCM Logo 2.png',
    './TCM Logo 2.png',
    '/TCM Logo 2.png',
    'TCM%20Logo%202.png',
    './TCM%20Logo%202.png'
  ];
  const loginImg = document.getElementById('login-logo-img');
  const sidebarImg = document.getElementById('sidebar-logo-img');
  const favicon = document.getElementById('favicon-link');
  function testImage(url, timeout){
    timeout = timeout || 4000;
    return new Promise(function(resolve){
      const img = new Image();
      let done = false;
      img.onload = function(){ if(!done){ done=true; resolve(true); } };
      img.onerror = function(){ if(!done){ done=true; resolve(false); } };
      setTimeout(function(){ if(!done){ done=true; resolve(false); } }, timeout);
      img.src = url;
    });
  }
  (async function(){
    for(const p of candidates){
      try{
        const ok = await testImage(p);
        if(ok){
          if(loginImg) loginImg.src = p;
          if(sidebarImg) sidebarImg.src = p;
          if(favicon) favicon.href = p;
          return;
        }
      }catch(e){ /* ignore */ }
    }
    // If none found, keep the external default image.
  })();
});
</script>

</body>
